plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'maven-publish'
}

base.archivesName = rootProject.archives_base_name + '-forge'

minecraft {
    mappings channel: 'official', version: rootProject.minecraft_version
    copyIdeResources = true
}

dependencies {
    minecraft "net.minecraftforge:forge:${rootProject.forge_version}"
}

sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

jar {
    from(rootProject.file('LICENSE'))
    finalizedBy 'reobfJar'
}

sourcesJar {
    from(rootProject.file('LICENSE'))
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifact jar
        }
    }
}
